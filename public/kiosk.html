<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/logo-source.png">
  <title>Tavolinë — Revolution Invest POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/staff-brand.css">
  <link rel="stylesheet" href="/css/waiter.css?v=8">
  <link rel="stylesheet" href="/css/menu-pos.css?v=16">
  <link rel="stylesheet" href="/css/waiter-phone-truffle.css?v=3">
  <link rel="stylesheet" href="/css/order-track.css?v=1">
  <style>
    .kiosk-badge {
      display: inline-block;
      margin-top: 0.35rem;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: rgba(255, 107, 53, 0.2);
      color: #ffb088;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .kiosk-hint {
      color: #94a3b8;
      font-size: 0.82rem;
      text-align: center;
      margin: 0.5rem 0 0;
      line-height: 1.4;
    }
    body.kiosk-body {
      height: 100dvh;
      overflow: hidden;
      background: #1a1a2e;
      font-family: "Inter", system-ui, sans-serif;
      color: #fff;
    }
    #screen-order.kiosk-screen {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      background: #1a1a2e;
    }
    #screen-order.kiosk-screen .waiter-main.order-main {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--kiosk-cart-height, 12rem);
      background: #1a1a2e !important;
    }
    #screen-order.kiosk-screen .menu-pos-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
    }
    #screen-order.kiosk-screen .menu-photo-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      background: #1a1a2e !important;
    }
    #screen-order.kiosk-screen .menu-photo-grid-inner {
      padding-bottom: 1rem;
    }
    #screen-order.kiosk-screen .cart-bar .btn-primary,
    #screen-order.kiosk-screen #btn-send {
      background: #ff6b35 !important;
      border: none !important;
      border-radius: 14px !important;
      color: #fff !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
    }
    #screen-order.kiosk-screen .cart-total {
      color: #fff;
    }
    #screen-order.kiosk-screen #cart-total {
      color: #ff6b35 !important;
      font-weight: 800;
    }
    #screen-success.kiosk-success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
      background: #1a1a2e;
    }
    #screen-success.kiosk-success-screen.active {
      display: flex;
    }
    .kiosk-success-card {
      width: 100%;
      max-width: 22rem;
      text-align: center;
      padding: 2rem 1.5rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    .kiosk-success-icon {
      font-size: 3rem;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    .kiosk-success-card h1 {
      margin: 0 0 0.65rem;
      font-size: 1.35rem;
      font-weight: 800;
    }
    .kiosk-success-card p {
      margin: 0 0 1.25rem;
      color: #94a3b8;
      line-height: 1.55;
      font-size: 0.95rem;
    }
    #btn-order-again {
      width: 100%;
      background: #ff6b35 !important;
      border: none !important;
      border-radius: 14px !important;
      color: #fff !important;
      font-weight: 800 !important;
      padding: 0.85rem 1rem;
      box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
    }
  </style>
</head>
<body class="kiosk-body">
  <div id="screen-order" class="screen active kiosk-screen">
    <div class="staff-app-bar">
      <img src="/logo-source.png" width="28" height="28" alt="Revolution Invest POS">
      <span>Revolution Invest POS</span>
      <span class="staff-app-venue" id="kiosk-venue-name">Tavolinë</span>
    </div>
    <div class="waiter-header">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem">
        <div>
          <h1 id="kiosk-title" style="margin:0;font-size:1.1rem">Tavolinë</h1>
          <div class="kiosk-badge" id="kiosk-table-label">T—</div>
        </div>
      </div>
      <p class="kiosk-hint" id="sync-hint">Porosia shkon te banaku — jo faturë.</p>
    </div>
    <div class="waiter-main order-main">
      <div id="order-err" class="err hidden"></div>
      <div class="order-layout menu-pos-wrap">
        <div id="menu-cat-bar"></div>
        <div id="menu-grid" class="menu-photo-grid"></div>
      </div>
    </div>
    <div id="cart-bar" class="cart-bar">
      <div id="cart-lines" class="cart-lines"></div>
      <div class="cart-total">
        <span>Totali</span>
        <span id="cart-total">0.00 €</span>
      </div>
      <div class="cart-actions">
        <button type="button" class="btn btn-primary" id="btn-send">Dërgo porosinë te banaku</button>
      </div>
    </div>
  </div>

  <div id="screen-success" class="screen kiosk-success-screen">
    <div class="kiosk-success-card">
      <div class="kiosk-success-icon" aria-hidden="true">✅</div>
      <h1>Porosia u dërgua!</h1>
      <p id="success-msg">Porosia juaj u dërgua te banaku.</p>
      <p class="order-track-status-label" id="order-track-label">Në pritje</p>
      <p class="order-track-status-detail" id="order-track-detail">Restoranti do ta pranojë porosinë tuaj.</p>
      <ul class="order-track-steps" id="order-track-steps" aria-label="Statusi i porosisë"></ul>
      <p class="order-track-updated" id="order-track-updated"></p>
      <button type="button" class="btn btn-primary" id="btn-order-again">Porosi tjetër</button>
    </div>
  </div>

    <footer style="text-align:center; padding:10px; font-size:12px; color:#888; margin-top:20px;">
      Powered by <a href="https://revolution-pos.com" style="color:#fff; font-weight:bold;">Revolution POS</a>
    </footer>
  <script src="/js/menuCatalog.js?v=1"></script>
  <script src="/js/menu-pos.js?v=18"></script>
  <script src="/js/order-track.js?v=1"></script>
  <script src="/js/product-path.js?v=3"></script>
  <script src="/js/kiosk.js?v=16"></script>
</body>
</html>
