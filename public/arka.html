<!DOCTYPE html>
<html lang="sq" class="waiter-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Revolution Arka">
  <link rel="manifest" id="pwa-manifest" href="/logo-icon.svg">
  <link rel="icon" href="/logo-icon.svg">
  <title>Revolution Arka</title>
  <link rel="stylesheet" href="/css/pos-program-style.css">
  <link rel="stylesheet" href="/css/pos-program-waiter.css">
  <link rel="stylesheet" href="/css/pos-program-truffle.css">
  <link rel="stylesheet" href="/css/pos-program-tables.css">
  <style>
    .pos-pazar-eye { border: 0; background: transparent; color: inherit; padding: 4px; line-height: 0; cursor: pointer; }
    .waiter-kpi-cash { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px; }
    .pos-shift-pazar-box:not([hidden]) { display: flex; flex-direction: column; align-items: flex-end; }
    #gate, #pin-box { max-width: 420px; margin: 24px auto; background: #fff; color: #111827; border-radius: 16px; padding: 16px; }
    #pin { width: 100%; font-size: 1.4rem; letter-spacing: .35em; text-align: center; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
    #pay-msg { min-height: 1.2rem; margin: 0 0 8px; color: #b91c1c; font-weight: 700; }
    .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
    .sheet .panel { background: #fff; color: #111827; width: min(520px, 100%); border-radius: 16px 16px 0 0; padding: 16px; max-height: 80vh; overflow: auto; }
    .sheet li { margin: 6px 0; }
    #net-banner { background: #c9891a; color: #1a1204; text-align: center; padding: 8px 12px; font-weight: 650; }
    .hidden { display: none !important; }
    html, body.waiter-screen { height: 100%; margin: 0; }
    #ekrani-porosia .line { padding: .45rem 0; border-bottom: 1px solid #e5e7eb; color: #111827; }
    #ekrani-porosia .line .nm { font-weight: 700; font-size: .82rem; }
    #ekrani-porosia .line .sum { color: #ff6b35; font-weight: 800; font-size: .8rem; }
    #ekrani-porosia .qty { display: flex; gap: 4px; align-items: center; margin-top: 4px; }
    #ekrani-porosia .qty button { width: 28px; height: 28px; padding: 0; border-radius: 8px; background: #111827; color: #fff; }
    #ekrani-porosia .card-title { font-weight: 800; margin: .35rem 0; }
    #ekrani-porosia .btn-coupon.on { box-shadow: inset 0 0 0 2px #16a34a; }

  </style>
</head>
<body class="waiter-screen">
  <div id="net-banner" class="hidden"></div>
  <section id="gate">
    <p id="gate-text">Po kontrollohet hyrja…</p>
    <a class="btn hidden" id="go-kycu" href="/kycu" style="display:inline-block;text-align:center;text-decoration:none">Hyr te Kyçu</a>
  </section>
  <section class="hidden" id="pin-box">
    <label for="pin">PIN i punonjësit</label>
    <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    <button type="button" class="btn" id="pin-go">Hyr</button>
    <div class="msg" id="pin-msg"></div>
  </section>
  <div id="ekrani-tavolina" class="waiter-shell hidden">
    <aside class="waiter-sidebar">
      <div class="waiter-sidebar-top">
        <div class="waiter-brand" title="Arka">K</div>
        <button type="button" class="waiter-sync-btn" id="btn-rifresko-tavolina" title="Rifresko tavolinat">↻</button>
      </div>
      <div class="waiter-sidebar-spacer"></div>
      <nav class="waiter-sidebar-nav">
        <button type="button" class="waiter-nav-btn waiter-nav-new" id="btn-nav-klaim">KLAIM E RE</button>
        <button type="button" class="waiter-nav-btn waiter-nav-orders" id="btn-nav-porosi">LISTA E POROSIVE</button>
        <button type="button" class="waiter-nav-btn waiter-nav-z" id="btn-sidebar-raporti-z">Raporti Z</button>
        <button type="button" class="waiter-nav-btn waiter-nav-exit" id="out">DIL</button>
      </nav>
    </aside>
    <main class="waiter-main">
      <header class="waiter-topbar">
        <div class="waiter-topbar-left">
          <span class="waiter-topbar-greeting">Hyrja,</span>
          <strong id="biz">Arka</strong>
        </div>
        <div class="waiter-topbar-time" id="waiter-clock">--:--</div>
      </header>
      <div class="waiter-kpi-row">
        <button type="button" class="waiter-kpi waiter-kpi-open" id="kpi-open-wrap"><span class="waiter-kpi-label">E HAPUR</span><span class="waiter-kpi-value" id="kpi-hapur">0</span></button>
        <button type="button" class="waiter-kpi waiter-kpi-free" id="kpi-free-wrap"><span class="waiter-kpi-label">LIRË</span><span class="waiter-kpi-value" id="kpi-lire">0</span></button>
        <button type="button" class="waiter-kpi waiter-kpi-new" id="kpi-re-wrap"><span class="waiter-kpi-label">QR TAVOLINA</span><span class="waiter-kpi-value" id="kpi-re">0</span></button>
        <button type="button" class="waiter-kpi waiter-kpi-kryesore" id="kpi-kryesore-wrap"><span class="waiter-kpi-label">KRYESORE</span><span class="waiter-kpi-value" id="kpi-kryesore">0</span></button>
        <button type="button" class="waiter-kpi waiter-kpi-terrasa" id="kpi-terrasa-wrap"><span class="waiter-kpi-label">TERRASA</span><span class="waiter-kpi-value" id="kpi-terrasa">0</span></button>
        <button type="button" class="waiter-kpi waiter-kpi-online" id="kpi-online-wrap"><span class="waiter-kpi-label">POROSI ONLINE</span><span class="waiter-kpi-value" id="kpi-online">0</span></button>
        <div class="waiter-kpi waiter-kpi-cash" id="kpi-cash-wrap">
          <button type="button" class="pos-pazar-eye" aria-label="Shfaq pazarin"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <div class="pos-shift-pazar-box" hidden><span class="waiter-kpi-label">MONEDHA NË ARKË</span><span class="waiter-kpi-value" id="kpi-arke">0.00 €</span></div>
        </div>
      </div>
      <div class="waiter-table-toolbar">
        <div>
          <h1 class="waiter-main-title" id="hdr-emri">Arka</h1>
          <p class="waiter-main-sub">Tavolina — restoranti / bari</p>
        </div>
        <div class="waiter-toolbar-actions">
          <button type="button" class="pos-pazar-eye" aria-label="Shfaq pazarin"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <span class="waiter-shift-total pos-shift-pazar-box" id="hdr-pazari" hidden>0.00 €</span>
          <button type="button" class="btn btn-shift-close btn-sm" id="btn-mbyll-nderrimin">Mbyll nderrimin</button>
        </div>
      </div>
      <div class="waiter-zones-scroll" id="floor"></div>
    </main>
  </div>
  <div id="ekrani-porosia">
    <div class="waiter-order-top">
      <div class="back-bar">
        <button type="button" class="btn btn-ghost btn-sm" id="back">← Kthehu te tavolinat</button>
      </div>
      <header class="header waiter-table-header"><h1 id="sell-table">Tavolina</h1></header>
    </div>
    <div class="waiter-order-body">
      <div class="menu-pos-wrap">
        <input id="find" type="search" placeholder="Skano barkodin" autocomplete="off" aria-label="Skano barkodin">
        <div class="menu-group-bar" id="cats"></div>
        <div class="menu-photo-grid" id="products"></div>
      </div>
      <aside class="waiter-orders-panel">
        <div class="order-list">
          <div class="card-title" id="sent-title">Në tavolinë (tashmë dërguar)</div>
          <div id="sent-lines"></div>
          <div class="card-title">Porosi e re</div>
          <div id="cart-lines"></div>
        </div>
        <div class="order-totals-stack">
          <div class="total-bar total-bar-line">
            <span class="total-bar-label">Totali</span>
            <span class="total-bar-amount" id="cart-total">0.00 €</span>
          </div>
        </div>
      </aside>
      <aside class="waiter-payments-panel">
        <div class="action-bar">
          <div id="pay-msg"></div>
          <div class="payments-btn-grid" id="pay-grid">
            <button type="button" class="btn btn-primary pos-pay-btn pos-pay-btn-send" data-act="send">Dërgo porosinë</button>
            <button type="button" class="btn btn-danger pos-pay-btn" data-act="cancel">Anullo porosinë</button>
            <div class="coupon-type-row payments-coupon-row">
              <button type="button" class="btn-coupon btn-coupon-fiscal pos-pay-btn" data-act="coupon" data-coupon="fiscal">Kuponi Fiskal</button>
              <button type="button" class="btn-coupon btn-coupon-thermal pos-pay-btn" data-act="coupon" data-coupon="thermal">Kuponi Termik</button>
            </div>
            <button type="button" class="btn btn-payment-cash pos-pay-btn" data-pay="cash">Cash</button>
            <button type="button" class="btn btn-payment-karte pos-pay-btn" data-pay="card">Kartë</button>
            <button type="button" class="btn btn-primary pos-pay-btn" data-pay="cash" data-mode="fiscal">Paguaj Fiskal</button>
            <button type="button" class="btn btn-ghost pos-pay-btn" data-pay="cash" data-mode="thermal">Paguaj (Termik)</button>
            <button type="button" class="btn btn-pay-nopaper pos-pay-btn" data-pay="cash" data-mode="paper">Paguaj pa letër</button>
            <button type="button" class="btn btn-ghost pos-pay-btn" data-act="preview">Shiko kuponin</button>
            <button type="button" class="btn btn-ghost btn-split-bill pos-pay-btn" data-act="split">Nda faturën</button>
          </div>
          <button type="button" class="btn hidden" id="fiscal-retry">Provo fiskalizimin përsëri</button>
        </div>
      </aside>
    </div>
  </div>
  <div class="sheet hidden" id="sheet">
    <div class="panel">
      <h2 id="sheet-title" style="margin:0 0 8px"></h2>
      <p id="sheet-note" class="sub"></p>
      <ul id="sheet-items"></ul>
      <button type="button" class="btn hidden" id="sheet-go">Paguaj të zgjedhurat</button>
      <button type="button" class="btn" id="sheet-close">Mbyll</button>
    </div>
  </div>
  <script src="/arka-offline.js"></script>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    let slug = parts[1] || "";
    try { slug = decodeURIComponent(slug); } catch (e) { slug = parts[1] || ""; }
    const key = new URLSearchParams(location.search).get("key") || "";
    let syncing = false;
    function apiUrl(path) {
      const q = key ? (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key) : "";
      return "/api/arka/" + encodeURIComponent(slug) + path + q;
    }
    async function remember(path, res) {
      if (!window.ArkaOffline || res.headers.get("X-Arka-Offline") === "1") return;
      const data = await res.json().catch(function () { return null; });
      if (!data) return;
      if (path === "/tables" && data.ok) ArkaOffline.saveTables(slug, data);
      if (path === "/categories" && data.categories) ArkaOffline.saveCategories(slug, data.categories);
      if (path.indexOf("/products/") === 0 && path.indexOf("/products/search/") !== 0 && data.products) {
        ArkaOffline.saveProducts(slug, data.products);
      }
    }
    function api(path, opts) {
      const headers = { "Content-Type": "application/json" };
      if (key) headers["x-kitchen-key"] = key;
      const sent = Object.assign({ credentials: "include", headers: headers }, opts || {});
      return fetch(apiUrl(path), sent).then(function (res) {
        if (res.ok) remember(path, res.clone());
        return res;
      }).catch(function () {
        return ArkaOffline.handle(slug, path, opts || {});
      });
    }
    function paintNet(text) {
      const el = document.getElementById("net-banner");
      if (!text) {
        el.classList.add("hidden");
        el.textContent = "";
        return;
      }
      el.textContent = text;
      el.classList.remove("hidden");
    }
    const gate = document.getElementById("gate");
    const pinBox = document.getElementById("pin-box");
    const floor = document.getElementById("floor");
    const kpis = document.getElementById("ekrani-tavolina");
    const sell = document.getElementById("ekrani-porosia");
    const biz = document.getElementById("biz");
    const outBtn = document.getElementById("out");
    let current = [];
    let cart = [];
    let sentLines = [];
    let sellTable = null;
    let paying = false;
    let lastSaleId = "";
    let lastPayType = "cash";
    let couponKind = "fiscal";
    let staffName = "";
    function euro(n) { return (Number(n) || 0).toFixed(2) + " €"; }
    function showGate(text, kycu) {
      floor.classList.add("hidden");
      kpis.classList.add("hidden");
      sell.classList.remove("active");
      sell.classList.add("hidden");
      pinBox.classList.add("hidden");
      outBtn.classList.add("hidden");
      gate.classList.remove("hidden");
      document.getElementById("gate-text").textContent = text;
      document.getElementById("go-kycu").classList.toggle("hidden", !kycu);
    }
    function showPin() {
      gate.classList.add("hidden");
      floor.classList.add("hidden");
      kpis.classList.add("hidden");
      sell.classList.remove("active");
      sell.classList.add("hidden");
      outBtn.classList.add("hidden");
      pinBox.classList.remove("hidden");
    }
    function cartTotal() {
      return cart.reduce(function (s, it) { return s + it.price * it.quantity; }, 0);
    }
    function asLine(it) {
      return {
        id: it.id != null && it.id !== "" ? String(it.id) : "",
        name: it.name || "",
        price: Number(it.price) || 0,
        quantity: Math.max(1, Math.round(Number(it.quantity) || 1)),
      };
    }
    function payloadItems(list) {
      return list.map(function (it) { return { product_id: it.id, quantity: it.quantity, price: it.price }; });
    }
    function paintSent() {
      const box = document.getElementById("sent-lines");
      const title = document.getElementById("sent-title");
      box.innerHTML = "";
      title.classList.toggle("hidden", !sentLines.length);
      sentLines.forEach(function (it) {
        const row = document.createElement("div");
        row.className = "line";
        const name = document.createElement("div");
        name.className = "nm";
        name.textContent = it.quantity + " × " + it.name;
        const sum = document.createElement("div");
        sum.className = "sum";
        sum.textContent = euro(it.price * it.quantity);
        row.appendChild(name);
        row.appendChild(sum);
        box.appendChild(row);
      });
    }
    function paintCart() {
      paintSent();
      const box = document.getElementById("cart-lines");
      box.innerHTML = "";
      cart.forEach(function (it, idx) {
        const row = document.createElement("div");
        row.className = "line";
        const name = document.createElement("div");
        name.className = "nm";
        name.textContent = it.name;
        const qty = document.createElement("div");
        qty.className = "qty";
        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.addEventListener("click", function () {
          if (it.quantity <= 1) cart.splice(idx, 1);
          else it.quantity -= 1;
          paintCart();
        });
        const n = document.createElement("span");
        n.textContent = String(it.quantity);
        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";
        plus.addEventListener("click", function () { it.quantity += 1; paintCart(); });
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "×";
        del.addEventListener("click", function () { cart.splice(idx, 1); paintCart(); });
        qty.appendChild(minus);
        qty.appendChild(n);
        qty.appendChild(plus);
        qty.appendChild(del);
        const sum = document.createElement("div");
        sum.className = "sum";
        sum.textContent = euro(it.price * it.quantity);
        row.appendChild(name);
        row.appendChild(sum);
        row.appendChild(qty);
        box.appendChild(row);
      });
      const sentSum = sentLines.reduce(function (s, it) { return s + it.price * it.quantity; }, 0);
      document.getElementById("cart-total").textContent = euro(sentSum + cartTotal());
    }
    function addProduct(p) {
      const found = cart.find(function (it) { return it.id === p.id; });
      if (found) found.quantity += 1;
      else cart.push({ id: p.id, name: p.name, price: Number(p.price) || 0, quantity: 1 });
      paintCart();
    }
    function paintProducts(list) {
      const box = document.getElementById("products");
      box.innerHTML = "";
      (list || []).forEach(function (p) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "menu-item-text-btn";
        const card = document.createElement("div");
        card.className = "menu-item-card" + (p.photo_url ? " has-photo" : "");
        if (p.photo_url) {
          const wrap = document.createElement("div");
          wrap.className = "menu-item-photo-wrap";
          const img = document.createElement("img");
          img.className = "menu-item-photo";
          img.alt = "";
          img.src = p.photo_url;
          wrap.appendChild(img);
          card.appendChild(wrap);
        }
        const meta = document.createElement("div");
        meta.className = "menu-item-meta";
        const name = document.createElement("span");
        name.className = "emri";
        name.textContent = p.name;
        const price = document.createElement("span");
        price.className = "cmimi";
        price.textContent = euro(p.price);
        meta.appendChild(name);
        meta.appendChild(price);
        card.appendChild(meta);
        b.appendChild(card);
        if (p.low_stock) {
          const w = document.createElement("span");
          w.className = "warn";
          w.textContent = "Pa stok";
          b.appendChild(w);
        }
        b.addEventListener("click", function () { addProduct(p); });
        box.appendChild(b);
      });
    }
    async function loadCategory(id, btn) {
      document.querySelectorAll(".menu-group-btn").forEach(function (el) { el.classList.remove("active"); });
      if (btn) btn.classList.add("active");
      const res = await api("/products/" + encodeURIComponent(id));
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) return;
      paintProducts(data.products || []);
    }
    async function openSell(t) {
      sellTable = t;
      sentLines = (t.items || []).filter(function (it) { return it.name; }).map(asLine);
      cart = [];
      floor.classList.add("hidden");
      kpis.classList.add("hidden");
      sell.classList.remove("hidden");
      sell.classList.add("active");
      document.getElementById("sell-table").textContent = "Tavolina " + t.number;
      document.getElementById("pay-msg").textContent = "";
      paintCart();
      const res = await api("/categories");
      const data = await res.json().catch(function () { return {}; });
      const cats = document.getElementById("cats");
      cats.innerHTML = "";
      (data.categories || []).forEach(function (c, i) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "menu-group-btn" + (i === 0 ? " active" : "");
        b.textContent = c.name;
        b.addEventListener("click", function () { loadCategory(c.id, b); });
        cats.appendChild(b);
        if (i === 0) loadCategory(c.id, b);
      });
      (data.categories || []).forEach(function (c) {
        api("/products/" + encodeURIComponent(c.id));
      });
    }
    let floorFilter = "all";
    let lastFloor = null;
    function hallOf(name) {
      const n = String(name || "").toLowerCase();
      if (n.indexOf("terras") >= 0) return "terrasa";
      if (n.indexOf("online") >= 0) return "online";
      return "kryesore";
    }
    function isQrTable(t) {
      const d = String(t.device_id || "").toUpperCase();
      return d.indexOf("WEB-KIOSK") === 0 || d.indexOf("WEB-PUBLIC") === 0;
    }
    function tableMatches(t, areaName) {
      if (floorFilter === "open") return t.status === "occupied";
      if (floorFilter === "free") return t.status !== "occupied";
      if (floorFilter === "qr") return isQrTable(t);
      if (floorFilter === "kryesore") return hallOf(areaName) === "kryesore";
      if (floorFilter === "terrasa") return hallOf(areaName) === "terrasa";
      if (floorFilter === "online") return hallOf(areaName) === "online";
      return true;
    }
    function paint(data) {
      lastFloor = data;
      gate.classList.add("hidden");
      pinBox.classList.add("hidden");
      floor.classList.remove("hidden");
      kpis.classList.remove("hidden");
      outBtn.classList.remove("hidden");
      sell.classList.remove("active");
      sell.classList.add("hidden");
      let openN = 0;
      let freeN = 0;
      let qrN = 0;
      let kryesoreN = 0;
      let terrasaN = 0;
      let onlineN = 0;
      (data.areas || []).forEach(function (area) {
        const hall = hallOf(area.name);
        (area.tables || []).forEach(function (t) {
          if (t.status === "occupied") openN += 1;
          else freeN += 1;
          if (isQrTable(t)) qrN += 1;
          if (hall === "terrasa") terrasaN += 1;
          else if (hall === "online") onlineN += 1;
          else kryesoreN += 1;
        });
      });
      document.getElementById("kpi-hapur").textContent = String(openN);
      document.getElementById("kpi-lire").textContent = String(freeN);
      document.getElementById("kpi-re").textContent = String(qrN);
      document.getElementById("kpi-kryesore").textContent = String(kryesoreN);
      document.getElementById("kpi-terrasa").textContent = String(terrasaN);
      document.getElementById("kpi-online").textContent = String(onlineN);
      document.getElementById("kpi-arke").textContent = euro(data.cash_total);
      document.getElementById("hdr-pazari").textContent = euro(data.cash_total);
      ["open", "free", "qr", "kryesore", "terrasa", "online"].forEach(function (name) {
        const el = document.getElementById(name === "open" ? "kpi-open-wrap" : name === "free" ? "kpi-free-wrap" : name === "qr" ? "kpi-re-wrap" : "kpi-" + name + "-wrap");
        if (el) el.classList.toggle("waiter-kpi-selected", floorFilter === name);
      });
      if (data.staff && data.staff.name) staffName = data.staff.name;
      biz.textContent = staffName || "Arka";
      if (data.business) document.getElementById("hdr-emri").textContent = data.business;
      current = [];
      floor.innerHTML = "";
      (data.areas || []).forEach(function (area) {
        const tables = (area.tables || []).filter(function (t) { return tableMatches(t, area.name); });
        if (!tables.length && floorFilter !== "all") return;
        const zone = document.createElement("section");
        zone.className = "waiter-zone-section";
        const head = document.createElement("div");
        head.className = "waiter-zone-head";
        const title = document.createElement("span");
        title.className = "waiter-zone-title";
        const hall = hallOf(area.name);
        title.textContent = hall === "terrasa" ? "Terrasa" : hall === "online" ? "Porosi online" : (area.name && area.name.toLowerCase().indexOf("tavolin") !== 0 ? area.name : "Kryesore");
        head.appendChild(title);
        const map = document.createElement("div");
        map.className = "table-floor-map";
        const rows = Math.max(1, Math.ceil(tables.length / 8));
        map.style.minHeight = Math.max(440, rows * 140) + "px";
        tables.forEach(function (t, i) {
          current.push(t);
          const b = document.createElement("button");
          b.type = "button";
          b.className = "table-card " + (t.status !== "occupied" ? "free" : "occupied");
          const col = i % 8;
          const row = Math.floor(i / 8);
          b.style.position = "absolute";
          b.style.left = (1.5 + col * 12.2) + "%";
          b.style.top = (8 + row * 130) + "px";
          const name = document.createElement("div");
          name.className = "table-card-name";
          name.textContent = "Tavolina " + t.number;
          const ico = document.createElement("div");
          ico.className = "table-card-icon";
          ico.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3.2 3.8-4.8 7-4.8S17.6 15.8 19 19"/></svg>';
          const meta = document.createElement("div");
          meta.className = "table-card-meta";
          meta.textContent = t.status !== "occupied" ? "Lirë" : ((t.item_count || t.order_count || 1) + " artikuj · " + euro(t.total));
          b.appendChild(name);
          b.appendChild(ico);
          if (t.status === "occupied" && t.waiter_name) {
            const who = document.createElement("div");
            who.className = "table-card-status";
            who.textContent = t.waiter_name;
            b.appendChild(who);
          }
          b.appendChild(meta);
          b.addEventListener("click", function () { openTable(t); });
          map.appendChild(b);
        });
        zone.appendChild(head);
        zone.appendChild(map);
        floor.appendChild(zone);
      });
      if (!floor.children.length) floor.textContent = "Nuk ka tavolina.";
    }
    function openTable(t) {
      openSell(t);
    }
    document.getElementById("sheet-close").addEventListener("click", function () {
      document.getElementById("sheet").classList.add("hidden");
    });
    function openSheet(title, note) {
      document.getElementById("sheet-title").textContent = title;
      document.getElementById("sheet-note").textContent = note || "";
      document.getElementById("sheet-items").innerHTML = "";
      const go = document.getElementById("sheet-go");
      go.classList.add("hidden");
      go.onclick = null;
      document.getElementById("sheet").classList.remove("hidden");
    }
    function showPreview() {
      const lines = sentLines.concat(cart);
      openSheet("Shiko kuponin", lines.length ? "" : "Shporta është bosh.");
      const list = document.getElementById("sheet-items");
      lines.forEach(function (it) {
        const li = document.createElement("li");
        li.textContent = it.quantity + " × " + it.name + " · " + euro(it.price * it.quantity);
        list.appendChild(li);
      });
      if (lines.length) {
        const li = document.createElement("li");
        li.textContent = "Totali " + document.getElementById("cart-total").textContent;
        list.appendChild(li);
      }
    }
    function splitBill() {
      const lines = sentLines.concat(cart);
      if (lines.length < 2) {
        openSheet("Nda faturën", "Duhen të paktën dy artikuj.");
        return;
      }
      openSheet("Nda faturën", "Zgjidh artikujt që paguhen tani.");
      const picked = {};
      const list = document.getElementById("sheet-items");
      lines.forEach(function (it, idx) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn";
        b.textContent = it.quantity + " × " + it.name;
        b.addEventListener("click", function () {
          picked[idx] = !picked[idx];
          b.style.outline = picked[idx] ? "3px solid #16a34a" : "";
        });
        li.appendChild(b);
        list.appendChild(li);
      });
      const go = document.getElementById("sheet-go");
      go.classList.remove("hidden");
      go.onclick = async function () {
        const chosen = lines.filter(function (it, idx) { return picked[idx]; });
        const left = lines.filter(function (it, idx) { return !picked[idx]; });
        if (!chosen.length || !left.length) {
          document.getElementById("sheet-note").textContent = "Zgjidh një pjesë, jo të gjitha.";
          return;
        }
        document.getElementById("sheet").classList.add("hidden");
        sentLines = chosen;
        cart = [];
        paintCart();
        await pay("cash", couponKind);
        const msg = document.getElementById("pay-msg").textContent;
        if (msg.indexOf("Shitja u ruajt") !== 0) {
          sentLines = lines;
          cart = [];
          paintCart();
          return;
        }
        const res = await api("/order", {
          method: "POST",
          body: JSON.stringify({ table_id: sellTable.number, items: payloadItems(left) }),
        });
        sentLines = left;
        cart = [];
        paintCart();
        if (!res || !res.ok) document.getElementById("pay-msg").textContent = msg + " Pjesa tjetër nuk u la në tavolinë.";
        else document.getElementById("pay-msg").textContent = msg + " Pjesa tjetër mbeti në tavolinë.";
      };
    }
    document.addEventListener("click", function (ev) {
      const eye = ev.target.closest && ev.target.closest(".pos-pazar-eye");
      if (!eye) return;
      ev.preventDefault();
      const box = eye.parentElement && eye.parentElement.querySelector(".pos-shift-pazar-box");
      if (!box) return;
      box.hidden = !box.hidden;
    });
    function setFloorFilter(name) {
      floorFilter = floorFilter === name ? "all" : name;
      if (lastFloor) paint(lastFloor);
    }
    document.getElementById("kpi-open-wrap").addEventListener("click", function () { setFloorFilter("open"); });
    document.getElementById("kpi-free-wrap").addEventListener("click", function () { setFloorFilter("free"); });
    document.getElementById("kpi-re-wrap").addEventListener("click", function () { setFloorFilter("qr"); });
    document.getElementById("kpi-kryesore-wrap").addEventListener("click", function () { setFloorFilter("kryesore"); });
    document.getElementById("kpi-terrasa-wrap").addEventListener("click", function () { setFloorFilter("terrasa"); });
    document.getElementById("kpi-online-wrap").addEventListener("click", function () { setFloorFilter("online"); });
    document.getElementById("btn-rifresko-tavolina").addEventListener("click", function () { loadTables(); });
    function allTables() {
      const out = [];
      ((lastFloor && lastFloor.areas) || []).forEach(function (area) {
        (area.tables || []).forEach(function (t) { out.push(t); });
      });
      return out;
    }
    document.getElementById("btn-nav-klaim").addEventListener("click", function () {
      const free = allTables().find(function (t) { return t.status !== "occupied"; });
      if (!free) return openSheet("Klaim e re", "Nuk ka tavolina të lira.");
      openSell(free);
    });
    document.getElementById("btn-nav-porosi").addEventListener("click", function () {
      const rows = allTables().filter(function (t) { return t.status === "occupied"; });
      openSheet("Lista e porosive", rows.length ? "Kliko një porosi." : "Nuk ka porosi të hapura.");
      const list = document.getElementById("sheet-items");
      rows.forEach(function (t) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn";
        b.textContent = "Tavolina " + t.number + " · " + euro(t.total);
        b.addEventListener("click", function () {
          document.getElementById("sheet").classList.add("hidden");
          openSell(t);
        });
        li.appendChild(b);
        list.appendChild(li);
      });
    });
    document.getElementById("btn-sidebar-raporti-z").addEventListener("click", async function () {
      openSheet("Raporti Z", "Po ngarkohet...");
      const res = await api("/z-report");
      const data = await res.json().catch(function () { return {}; });
      document.getElementById("sheet-note").textContent = !res.ok
        ? (data.gabim || "Raporti nuk u hap.")
        : ("Data " + (data.date || "") + " · Shitje " + (data.sales || 0) + " · Cash " + euro(data.cash) + " · Kartë " + euro(data.card) + " · Totali " + euro(data.total));
    });
    document.getElementById("btn-mbyll-nderrimin").addEventListener("click", function () {
      openSheet("Mbyll nderrimin", "Monedha në arkë " + document.getElementById("kpi-arke").textContent);
    });
    function tickClock() {
      const el = document.getElementById("waiter-clock");
      if (!el) return;
      const n = new Date();
      el.textContent = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0");
    }
    tickClock();
    setInterval(tickClock, 1000);
    document.getElementById("back").addEventListener("click", function () {
      sell.classList.remove("active");
      sell.classList.add("hidden");
      cart = [];
      sentLines = [];
      sellTable = null;
      loadTables();
    });
    let findTimer = null;
    document.getElementById("find").addEventListener("input", function () {
      const q = document.getElementById("find").value.trim();
      clearTimeout(findTimer);
      if (!q) return;
      findTimer = setTimeout(async function () {
        const res = await api("/products/search/" + encodeURIComponent(q));
        const data = await res.json().catch(function () { return {}; });
        if (res.ok) paintProducts(data.products || []);
      }, 250);
    });
    async function sendOrder() {
      if (paying || !sellTable) return;
      if (!cart.length) {
        document.getElementById("pay-msg").textContent = "Shtoni të paktën një artikull.";
        return;
      }
      const items = sentLines.concat(cart);
      paying = true;
      document.getElementById("pay-msg").textContent = "Po regjistrohet porosia...";
      try {
        const res = await api("/order", {
          method: "POST",
          body: JSON.stringify({ table_id: sellTable.number, items: payloadItems(items) }),
        });
        const data = await res.json().catch(function () { return {}; });
        if (!res || !res.ok) {
          document.getElementById("pay-msg").textContent = (data && data.gabim) || "Porosia nuk u regjistrua.";
          return;
        }
        sentLines = items;
        cart = [];
        paintCart();
        document.getElementById("pay-msg").textContent = "Porosia u regjistrua. " + euro(data.total);
      } finally {
        paying = false;
      }
    }
    async function pay(type, mode) {
      if (paying || !sellTable) return;
      const items = sentLines.concat(cart);
      if (!items.length) {
        document.getElementById("pay-msg").textContent = "Shporta është bosh.";
        return;
      }
      const how = mode || couponKind || "fiscal";
      paying = true;
      document.getElementById("pay-msg").textContent = "Po ruhet shitja...";
      try {
      const res = await api("/sale", {
        method: "POST",
        body: JSON.stringify({
          table_id: sellTable.number,
          payment_type: type,
          items: payloadItems(items)
        })
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res || !res.ok) {
        document.getElementById("pay-msg").textContent = (data && data.gabim) || "Shitja nuk u ruajt.";
        return;
      }
      lastSaleId = data.sale_id || "";
      lastPayType = type;
      cart = [];
      sentLines = [];
      paintCart();
      if (how === "thermal") {
        document.getElementById("pay-msg").textContent = "Shitja u ruajt. " + euro(data.total) + " Duke printuar kuponin termik...";
        document.getElementById("fiscal-retry").classList.add("hidden");
        sendPrint(null);
        return;
      }
      if (how === "paper") {
        document.getElementById("pay-msg").textContent = "Shitja u ruajt. " + euro(data.total);
        document.getElementById("fiscal-retry").classList.add("hidden");
        return;
      }
      document.getElementById("pay-msg").textContent = "Shitja u ruajt. " + euro(data.total) + " Duke fiskalizuar...";
      document.getElementById("fiscal-retry").classList.add("hidden");
      fiscalize(true);
      } finally {
        paying = false;
      }
    }
    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
    async function sendPrint(fiscal) {
      const note = document.getElementById("pay-msg").textContent;
      document.getElementById("pay-msg").textContent = note + " Duke printuar...";
      const res = await api("/print", {
        method: "POST",
        body: JSON.stringify({
          sale_id: lastSaleId,
          fiscal_number: fiscal && fiscal.fiscal_number ? fiscal.fiscal_number : "",
          nuikf: fiscal && fiscal.nuikf ? fiscal.nuikf : "",
          payment_type: lastPayType,
          staff_name: staffName,
          table_name: sellTable ? sellTable.number : ""
        })
      });
      const data = await res.json().catch(function () { return {}; });
      if (data.offline) {
        document.getElementById("pay-msg").textContent = note + " Printimi do dërgohet kur kthehet interneti.";
        return;
      }
      if (!res.ok || !data.id) {
        document.getElementById("pay-msg").textContent = note + " " + (data.gabim || "Printeri nuk u gjet");
        return;
      }
      for (let i = 0; i < 4; i += 1) {
        await wait(2000);
        const st = await api("/print/job/" + encodeURIComponent(data.id));
        const job = await st.json().catch(function () { return {}; });
        if (job.status === "printed") {
          document.getElementById("pay-msg").textContent = note + " U printua";
          return;
        }
        if (job.status === "failed") {
          document.getElementById("pay-msg").textContent = note + " Printeri nuk u gjet";
          return;
        }
      }
      document.getElementById("pay-msg").textContent = note + " Printeri nuk u gjet";
    }
    async function fiscalize(andPrint) {
      if (!lastSaleId) return;
      const res = await api("/fiscal", { method: "POST", body: JSON.stringify({ sale_id: lastSaleId, payment_type: lastPayType }) });
      const data = await res.json().catch(function () { return {}; });
      const msg = document.getElementById("pay-msg");
      const retry = document.getElementById("fiscal-retry");
      if (data.code === "NO_KEY") {
        msg.textContent = "Çelësi fiskal nuk është konfiguruar — kontakto administratorin";
        retry.classList.add("hidden");
        if (andPrint) sendPrint(data);
        return;
      }
      if (data.queued) {
        msg.textContent = "Shitja u ruajt. ATK nuk u arrit. Do provohet vetë.";
        retry.classList.remove("hidden");
        if (andPrint) sendPrint(data);
        return;
      }
      if (!res.ok || data.ok === false) {
        msg.textContent = data.gabim || "Fiskalizimi dështoi. Shitja mbetet e ruajtur.";
        retry.classList.remove("hidden");
        if (andPrint) sendPrint(data);
        return;
      }
      msg.textContent = "Kuponi u dërgua. Numri " + (data.fiscal_number || "") + (data.nuikf ? " · " + data.nuikf : "");
      retry.classList.add("hidden");
      if (andPrint) sendPrint(data);
    }
    document.getElementById("fiscal-retry").addEventListener("click", function () { fiscalize(false); });
    document.getElementById("pay-grid").addEventListener("click", function (ev) {
      const btn = ev.target.closest("button");
      if (!btn || !document.getElementById("pay-grid").contains(btn)) return;
      if (btn.getAttribute("data-act") === "send") {
        sendOrder();
        return;
      }
      if (btn.getAttribute("data-act") === "cancel") {
        cart = [];
        paintCart();
        document.getElementById("pay-msg").textContent = "Porosia e re u hoq.";
        return;
      }
      if (btn.getAttribute("data-act") === "preview") {
        showPreview();
        return;
      }
      if (btn.getAttribute("data-act") === "split") {
        splitBill();
        return;
      }
      if (btn.getAttribute("data-act") === "coupon") {
        couponKind = btn.getAttribute("data-coupon") === "thermal" ? "thermal" : "fiscal";
        document.querySelectorAll("#pay-grid [data-act='coupon']").forEach(function (el) { el.classList.remove("on"); });
        btn.classList.add("on");
        document.getElementById("pay-msg").textContent = couponKind === "thermal"
          ? "Kuponi termik. Shtyp Cash, Kartë ose Paguaj (Termik)."
          : "Kuponi fiskal. Shtyp Cash, Kartë ose Paguaj Fiskal.";
        return;
      }
      const type = btn.getAttribute("data-pay");
      if (!type) return;
      const mode = btn.getAttribute("data-mode") || couponKind;
      pay(type, mode);
    });
    async function loadTables() {
      const res = await api("/tables");
      const data = await res.json().catch(function () { return {}; });
      if (res.status === 401 && data.code === "PIN_REQUIRED") return showPin();
      if (!res.ok) return showGate(data.gabim || "Tavolinat nuk u ngarkuan.", false);
      paint(data);
    }
    async function boot() {
      if (!slug || !key) return showGate("Hapni linkun e plotë të arkës, me kodin e lokalit.", false);
      const res = await api("/session");
      const data = await res.json().catch(function () { return {}; });
      if (res.status === 401) return showGate("Hyni fillimisht me email, fjalëkalim dhe kodin 6-shifror.", true);
      if (!res.ok) return showGate(data.gabim || "Hyrja dështoi.", false);
      document.getElementById("hdr-emri").textContent = data.business || "Arka";
      if (data.staff && window.ArkaOffline) ArkaOffline.saveSession(slug, { staff: data.staff, business: data.business || "" });
      if (!data.staff) return showPin();
      loadTables();
    }
    async function syncPost(path, body) {
      const res = await fetch(apiUrl(path), {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json", "X-Arka-Sync": "1", ...(key ? { "x-kitchen-key": key } : {}) },
        body: JSON.stringify(body)
      });
      return res;
    }
    function isServerId(id) {
      const s = String(id || "");
      return s.length > 10 && s.indexOf("local-") !== 0;
    }
    async function syncNow() {
      if (syncing || !navigator.onLine || !window.ArkaOffline) return;
      const sales = await ArkaOffline.pending("pending_sales", slug);
      const fiscals = await ArkaOffline.pending("pending_fiscal", slug);
      const prints = await ArkaOffline.pending("pending_prints", slug);
      if (!sales.length && !fiscals.length && !prints.length) {
        paintNet("");
        return;
      }
      syncing = true;
      paintNet("Duke sinkronizuar...");
      let sent = 0;
      let blocked = false;
      try {
        for (const row of sales) {
          let res;
          try { res = await syncPost("/sale", row.body || {}); }
          catch (e) { blocked = true; break; }
          if (!res.ok) { blocked = true; break; }
          const data = await res.json().catch(function () { return {}; });
          if (!data.sale_id) { blocked = true; break; }
          await ArkaOffline.retarget(slug, row.local_id, data.sale_id);
          await ArkaOffline.remove("pending_sales", row.local_id);
          sent += 1;
        }
        const fiscalRows = await ArkaOffline.pending("pending_fiscal", slug);
        for (const row of fiscalRows) {
          if (blocked) break;
          if (!isServerId(row.sale_id)) continue;
          let res;
          try { res = await syncPost("/fiscal", Object.assign({}, row.body || {}, { sale_id: row.sale_id })); }
          catch (e) { blocked = true; break; }
          if (res.status >= 500) { blocked = true; break; }
          if (!res.ok && res.status !== 200) continue;
          const data = await res.json().catch(function () { return {}; });
          if (data.code === "NO_KEY" || (res.status >= 400 && res.status < 500 && !data.queued && data.ok === false)) continue;
          await ArkaOffline.attachFiscal(slug, row.local_sale_id, data);
          await ArkaOffline.remove("pending_fiscal", row.local_id);
        }
        const printRows = await ArkaOffline.pending("pending_prints", slug);
        for (const row of printRows) {
          if (blocked) break;
          if (!isServerId(row.sale_id)) continue;
          const stillFiscal = (await ArkaOffline.pending("pending_fiscal", slug)).some(function (f) {
            return f.local_sale_id === row.local_sale_id;
          });
          if (stillFiscal) continue;
          let res;
          try { res = await syncPost("/print", Object.assign({}, row.body || {}, { sale_id: row.sale_id })); }
          catch (e) { blocked = true; break; }
          if (!res.ok) { blocked = true; break; }
          await ArkaOffline.remove("pending_prints", row.local_id);
        }
        if (!blocked) {
          const tables = await api("/tables");
          if (tables.ok) {
            const data = await tables.json().catch(function () { return null; });
            if (data && !floor.classList.contains("hidden")) paint(data);
          }
          const cats = await api("/categories");
          const catData = await cats.json().catch(function () { return {}; });
          (catData.categories || []).forEach(function (c) { api("/products/" + encodeURIComponent(c.id)); });
        }
      } finally {
        syncing = false;
        if (!navigator.onLine) paintNet("Pa internet — shitjet ruhen lokalisht. Bllokimi i tavolinave nuk punon pa internet.");
        else if (sent > 0) paintNet("U sinkronizua — " + sent + " shitje u dërguan");
        else paintNet("");
      }
    }
    document.getElementById("pin-go").addEventListener("click", async function () {
      document.getElementById("pin-msg").textContent = "";
      const res = await api("/pin", { method: "POST", body: JSON.stringify({ pin: document.getElementById("pin").value }) });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        document.getElementById("pin-msg").textContent = data.gabim || "PIN i gabuar.";
        return;
      }
      loadTables();
    });
    outBtn.addEventListener("click", async function () {
      await api("/logout-pin", { method: "POST", body: "{}" });
      showPin();
    });
    document.getElementById("pwa-manifest").href = location.pathname + "/manifest.json" + location.search;
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/arka-sw.js", { scope: location.pathname }).catch(function () {});
    }
    window.addEventListener("online", function () { syncNow(); });
    window.addEventListener("offline", function () {
      paintNet("Pa internet — shitjet ruhen lokalisht. Bllokimi i tavolinave nuk punon pa internet.");
    });
    if (!navigator.onLine) paintNet("Pa internet — shitjet ruhen lokalisht. Bllokimi i tavolinave nuk punon pa internet.");
    boot();
    setInterval(function () { if (!floor.classList.contains("hidden") && navigator.onLine && !syncing) loadTables(); }, 5000);
    setInterval(function () { if (navigator.onLine) syncNow(); }, 20000);
  </script>
