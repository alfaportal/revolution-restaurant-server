<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Revolution Arka">
  <link rel="manifest" id="pwa-manifest" href="/logo-icon.svg">
  <link rel="icon" href="/logo-icon.svg">
  <title>Revolution Arka</title>
  <style>
    :root { color-scheme: dark; --bg:#1a1a2e; --text:#f8fafc; --muted:#9ca3af; --accent:#ff6b35; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,sans-serif; background:#0b1220; color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; }
    h1 { font-size:1.35rem; margin:0; font-weight:900; }
    .sub { color:#f1f5f9; font-size:.9rem; font-weight:700; margin-top:2px; }
    main { padding:0 12px 16px; }
    .card { background:#16213a; border:1px solid #1e293b; border-radius:14px; padding:16px; max-width:480px; margin:16px auto; }
    label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px; }
    #pin, #find { width:100%; font-family:inherit; border-radius:8px; }
    #pin { font-size:1.4rem; letter-spacing:.35em; text-align:center; padding:12px; border:1px solid #2e2e45; background:#12121f; color:#fff; }
    #find { font-size:1rem; letter-spacing:0; text-align:left; padding:.55rem .7rem; border:1px solid #e5e7eb; background:#fff; color:#111827; }
    #sell { display:flex; flex-direction:column; min-height:100vh; background:#1a1a2e; margin:0 -12px; }
    .sell-top { background:#1e1e2e; border-bottom:1px solid rgba(255,255,255,.06); }
    .back-bar { display:flex; align-items:center; justify-content:space-between; padding:.7rem 1rem; }
    #back { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:999px; color:#f8fafc; font-weight:600; font-size:.84rem; min-height:40px; padding:.45rem 1rem; width:auto; margin:0; }
    .table-banner { background:#ff6b35; color:#fff; padding:.9rem 1.15rem; }
    .table-banner h2 { margin:0; font-size:1.45rem; font-weight:800; }
    .sell { display:flex; flex-direction:column; min-height:0; }
    .products-wrap, .cart, .pays { min-width:0; }
    .products-wrap { display:flex; flex-direction:column; padding:.55rem .65rem .75rem; }
    .cats { display:flex; flex-direction:row; flex-wrap:nowrap; gap:.45rem; overflow-x:auto; padding:.45rem .1rem .65rem; }
    .cat { flex:0 0 auto; background:#2d2d44; color:#fff; border:0; border-radius:999px; min-height:38px; padding:.45rem 1rem; font-weight:700; font-size:.8rem; width:auto; margin:0; white-space:nowrap; }
    .cat.on, .cat.on:hover { background:#ff6b35; color:#fff; }
    .products { display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:.5rem; }
    .prod { background:#fff; color:#111827; border:1px solid rgba(0,0,0,.04); border-radius:12px; min-height:5.1rem; padding:0; margin:0; width:100%; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.12); display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; }
    .prod .strip { display:block; height:44px; background:linear-gradient(145deg,rgba(255,107,53,.16),rgba(26,26,46,.04)),#f3f4f6; }
    .prod img { width:100%; aspect-ratio:1.1/1; object-fit:cover; display:block; background:#fff; }
    .prod.has-photo .strip { display:none; }
    .prod b { display:block; font-size:.74rem; font-weight:700; line-height:1.2; padding:.4rem .35rem 0; }
    .prod .price { display:block; color:#ff6b35; font-weight:800; font-size:.76rem; padding:0 .35rem .45rem; }
    .warn { color:#b91c1c; font-size:.7rem; padding-bottom:.3rem; }
    .cart, .pays { background:#f8f9fb; color:#111827; }
    .cart { padding:.45rem .5rem; }
    .cart-title { font-weight:800; margin-bottom:.35rem; }
    .line { padding:.45rem 0; border-bottom:1px solid #e5e7eb; }
    .line .nm { font-weight:700; font-size:.82rem; }
    .line .sum { color:#ff6b35; font-weight:800; font-size:.8rem; }
    .qty { display:flex; gap:4px; align-items:center; margin-top:4px; }
    .qty button { width:28px; height:28px; padding:0; margin:0; border-radius:8px; background:#111827; color:#fff; }
    #cart-total { margin:.6rem 0; font-size:1rem; font-weight:800; }
    .pays { padding:.4rem .45rem .6rem; }
    .pay-row { display:grid; grid-template-columns:1fr; gap:.4rem; }
    .pay-row .btn { margin:0; width:100%; min-height:3rem; height:3rem; border:0; border-radius:10px; background:#111827; color:#fff; font-weight:700; font-size:.78rem; }
    .pay-row .btn.on { background:#16a34a; }
    #pay-msg { color:#b91c1c; }
    #fiscal-retry { background:#111827; color:#fff; }
    @media (min-width: 768px) {
      .sell { flex-direction:row; align-items:stretch; min-height:calc(100vh - 120px); }
      .products-wrap { flex:0 0 70%; width:70%; }
      .cart { flex:0 0 15%; width:15%; overflow:auto; }
      .pays { flex:0 0 15%; width:15%; background:#f3f4f6; overflow:auto; }
    }
    button { font-family:inherit; cursor:pointer; }
    .btn { background:#ff6b35; color:#fff; width:100%; margin-top:12px; border:0; border-radius:10px; padding:12px 16px; font-weight:700; }
    .btn-ghost { background:transparent; color:var(--muted); border:1px solid #334155; width:auto; border-radius:10px; padding:10px 14px; }
    .msg { min-height:1.2rem; margin-top:10px; color:#f0b4b4; }
    .zone { margin:0 0 18px; }
    .zone h2 { margin:0 0 .55rem; padding-bottom:.4rem; border-bottom:1px solid #ef4444; color:#f8fafc; font-size:.95rem; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
    .grid { display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:10px 8px; }
    @media (max-width: 900px) { .grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    .table-card { width:100%; min-height:118px; border-radius:16px; padding:.45rem .3rem .4rem; display:flex; flex-direction:column; align-items:center; justify-content:space-between; color:#ecfdf5; margin:0; }
    .table-card .ico { width:22px; height:22px; opacity:.9; }
    .table-card.free { background:linear-gradient(180deg,#123526 0%,#0a1f18 100%); border:1px solid rgba(52,211,153,.75); box-shadow:0 0 0 1px rgba(16,185,129,.25),0 0 18px rgba(16,185,129,.42); }
    .table-card.occupied { background:linear-gradient(180deg,#3d1f08 0%,#1a0e05 100%); color:#fff7ed; border:1px solid rgba(251,146,60,.85); box-shadow:0 0 0 1px rgba(234,88,12,.3),0 0 20px rgba(234,88,12,.5); }
    .table-card b { font-size:.95rem; font-weight:800; text-align:center; }
    .table-card span { font-size:.72rem; text-align:center; font-weight:700; }
    .sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; }
    .sheet .panel { background:#101c38; width:min(520px,100%); border-radius:16px 16px 0 0; padding:16px; max-height:80vh; overflow:auto; }
    #net-banner { background:#c9891a; color:#1a1204; text-align:center; padding:8px 12px; font-weight:650; }
    .hidden { display:none !important; }
    ul { margin:8px 0 0; padding-left:18px; }
  </style>
</head>
<body>
  <div id="net-banner" class="hidden"></div>
  <header>
    <div>
      <h1>Arka</h1>
      <div class="sub" id="biz"></div>
    </div>
    <button type="button" class="btn-ghost hidden" id="out">Dil</button>
  </header>
  <main>
    <section class="card" id="gate">
      <p id="gate-text">Po kontrollohet hyrja…</p>
      <a class="btn hidden" id="go-kycu" href="/kycu" style="display:inline-block;text-align:center;text-decoration:none">Hyr te Kyçu</a>
    </section>
    <section class="card hidden" id="pin-box">
      <label for="pin">PIN i punonjësit të arkës</label>
      <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
      <button type="button" class="btn" id="pin-go">Hyr</button>
      <div class="msg" id="pin-msg"></div>
    </section>
    <section id="floor" class="hidden"></section>
    <section id="sell" class="hidden">
      <div class="sell-top">
        <div class="back-bar">
          <button type="button" id="back">← Kthehu te tavolinat</button>
        </div>
        <div class="table-banner"><h2 id="sell-table"></h2></div>
      </div>
      <div class="sell">
        <div class="products-wrap">
          <input id="find" type="search" placeholder="Skano barkodin" autocomplete="off">
          <div class="cats" id="cats"></div>
          <div class="products" id="products"></div>
        </div>
        <aside class="cart">
          <div class="cart-title">Porosi e re</div>
          <div id="cart-lines"></div>
          <div id="cart-total"></div>
        </aside>
        <aside class="pays">
          <div class="pay-row" id="pay-grid">
            <button type="button" class="btn" data-act="send">Dërgo porosinë</button>
            <button type="button" class="btn" data-act="cancel">Anullo porosinë</button>
            <button type="button" class="btn" data-act="coupon" data-coupon="fiscal">Kuponi Fiskal</button>
            <button type="button" class="btn" data-act="coupon" data-coupon="thermal">Kuponi Termik</button>
            <button type="button" class="btn" data-pay="cash">Cash</button>
            <button type="button" class="btn" data-pay="card">Kartë</button>
            <button type="button" class="btn" data-pay="cash">Paguaj Fiskal</button>
            <button type="button" class="btn" data-pay="cash">Paguaj (Termik)</button>
            <button type="button" class="btn" data-pay="cash">Paguaj pa letër</button>
            <button type="button" class="btn" data-act="preview">Shiko kuponin</button>
            <button type="button" class="btn" data-act="split">Nda faturën</button>
          </div>
          <div class="msg" id="pay-msg"></div>
          <button type="button" class="btn hidden" id="fiscal-retry">Provo fiskalizimin përsëri</button>
        </aside>
      </div>
    </section>
  </main>
  <div class="sheet hidden" id="sheet">
    <div class="panel">
      <h2 id="sheet-title" style="margin:0 0 8px"></h2>
      <p id="sheet-note" class="sub"></p>
      <ul id="sheet-items"></ul>
      <button type="button" class="btn" id="sheet-close">Mbyll</button>
    </div>
  </div>
  <script src="/arka-offline.js"></script>
  <script>
    const parts = location.pathname.split("/").filter(Boolean);
    let slug = parts[1] || "";
    try { slug = decodeURIComponent(slug); } catch (e) { slug = parts[1] || ""; }
    const key = new URLSearchParams(location.search).get("key") || "";
    let syncing = false;
    function apiUrl(path) {
      const q = key ? (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key) : "";
      return "/api/arka/" + encodeURIComponent(slug) + path + q;
    }
    async function remember(path, res) {
      if (!window.ArkaOffline || res.headers.get("X-Arka-Offline") === "1") return;
      const data = await res.json().catch(function () { return null; });
      if (!data) return;
      if (path === "/tables" && data.ok) ArkaOffline.saveTables(slug, data);
      if (path === "/categories" && data.categories) ArkaOffline.saveCategories(slug, data.categories);
      if (path.indexOf("/products/") === 0 && path.indexOf("/products/search/") !== 0 && data.products) {
        ArkaOffline.saveProducts(slug, data.products);
      }
    }
    function api(path, opts) {
      const headers = { "Content-Type": "application/json" };
      if (key) headers["x-kitchen-key"] = key;
      const sent = Object.assign({ credentials: "include", headers: headers }, opts || {});
      return fetch(apiUrl(path), sent).then(function (res) {
        if (res.ok) remember(path, res.clone());
        return res;
      }).catch(function () {
        return ArkaOffline.handle(slug, path, opts || {});
      });
    }
    function paintNet(text) {
      const el = document.getElementById("net-banner");
      if (!text) {
        el.classList.add("hidden");
        el.textContent = "";
        return;
      }
      el.textContent = text;
      el.classList.remove("hidden");
    }
    const gate = document.getElementById("gate");
    const pinBox = document.getElementById("pin-box");
    const floor = document.getElementById("floor");
    const sell = document.getElementById("sell");
    const biz = document.getElementById("biz");
    const outBtn = document.getElementById("out");
    let current = [];
    let cart = [];
    let sellTable = null;
    let paying = false;
    let lastSaleId = "";
    let lastPayType = "cash";
    let staffName = "";
    function euro(n) { return (Number(n) || 0).toFixed(2) + " €"; }
    function showGate(text, kycu) {
      floor.classList.add("hidden");
      sell.classList.add("hidden");
      pinBox.classList.add("hidden");
      outBtn.classList.add("hidden");
      gate.classList.remove("hidden");
      document.getElementById("gate-text").textContent = text;
      document.getElementById("go-kycu").classList.toggle("hidden", !kycu);
    }
    function showPin() {
      gate.classList.add("hidden");
      floor.classList.add("hidden");
      sell.classList.add("hidden");
      outBtn.classList.add("hidden");
      pinBox.classList.remove("hidden");
    }
    function cartTotal() {
      return cart.reduce(function (s, it) { return s + it.price * it.quantity; }, 0);
    }
    function paintCart() {
      const box = document.getElementById("cart-lines");
      box.innerHTML = "";
      cart.forEach(function (it, idx) {
        const row = document.createElement("div");
        row.className = "line";
        const name = document.createElement("div");
        name.className = "nm";
        name.textContent = it.name;
        const qty = document.createElement("div");
        qty.className = "qty";
        const minus = document.createElement("button");
        minus.type = "button";
        minus.textContent = "−";
        minus.addEventListener("click", function () {
          if (it.quantity <= 1) cart.splice(idx, 1);
          else it.quantity -= 1;
          paintCart();
        });
        const n = document.createElement("span");
        n.textContent = String(it.quantity);
        const plus = document.createElement("button");
        plus.type = "button";
        plus.textContent = "+";
        plus.addEventListener("click", function () { it.quantity += 1; paintCart(); });
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "×";
        del.addEventListener("click", function () { cart.splice(idx, 1); paintCart(); });
        qty.appendChild(minus);
        qty.appendChild(n);
        qty.appendChild(plus);
        qty.appendChild(del);
        const sum = document.createElement("div");
        sum.className = "sum";
        sum.textContent = euro(it.price * it.quantity);
        row.appendChild(name);
        row.appendChild(sum);
        row.appendChild(qty);
        box.appendChild(row);
      });
      document.getElementById("cart-total").textContent = cart.length ? ("Totali i porosisë së re " + euro(cartTotal())) : "Shtoni artikuj nga menuja";
    }
    function addProduct(p) {
      const found = cart.find(function (it) { return it.id === p.id; });
      if (found) found.quantity += 1;
      else cart.push({ id: p.id, name: p.name, price: Number(p.price) || 0, quantity: 1 });
      paintCart();
    }
    function paintProducts(list) {
      const box = document.getElementById("products");
      box.innerHTML = "";
      (list || []).forEach(function (p) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "prod";
        const strip = document.createElement("span");
        strip.className = "strip";
        const name = document.createElement("b");
        name.textContent = p.name;
        const price = document.createElement("span");
        price.className = "price";
        price.textContent = euro(p.price);
        if (p.photo_url) {
          const img = document.createElement("img");
          img.alt = "";
          img.src = p.photo_url;
          b.classList.add("has-photo");
          b.appendChild(img);
        } else {
          b.appendChild(strip);
        }
        b.appendChild(name);
        b.appendChild(price);
        if (p.low_stock) {
          const w = document.createElement("span");
          w.className = "warn";
          w.textContent = "Pa stok";
          b.appendChild(w);
        }
        b.addEventListener("click", function () { addProduct(p); });
        box.appendChild(b);
      });
    }
    async function loadCategory(id, btn) {
      document.querySelectorAll(".cat").forEach(function (el) { el.classList.remove("on"); });
      if (btn) btn.classList.add("on");
      const res = await api("/products/" + encodeURIComponent(id));
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) return;
      paintProducts(data.products || []);
    }
    async function openSell(t) {
      sellTable = t;
      cart = (t.items || []).filter(function (it) { return it.id; }).map(function (it) {
        return { id: it.id, name: it.name, price: Number(it.price) || 0, quantity: Math.max(1, Math.round(Number(it.quantity) || 1)) };
      });
      floor.classList.add("hidden");
      sell.classList.remove("hidden");
      document.getElementById("sell-table").textContent = "Tavolina " + t.number;
      document.getElementById("pay-msg").textContent = "";
      paintCart();
      const res = await api("/categories");
      const data = await res.json().catch(function () { return {}; });
      const cats = document.getElementById("cats");
      cats.innerHTML = "";
      (data.categories || []).forEach(function (c, i) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "cat" + (i === 0 ? " on" : "");
        b.textContent = c.name;
        b.addEventListener("click", function () { loadCategory(c.id, b); });
        cats.appendChild(b);
        if (i === 0) loadCategory(c.id, b);
      });
      (data.categories || []).forEach(function (c) {
        api("/products/" + encodeURIComponent(c.id));
      });
    }
    function paint(data) {
      gate.classList.add("hidden");
      pinBox.classList.add("hidden");
      floor.classList.remove("hidden");
      outBtn.classList.remove("hidden");
      if (data.staff && data.staff.name) staffName = data.staff.name;
      biz.textContent = (staffName ? staffName + " · " : "") + "tavolinat";
      current = [];
      floor.innerHTML = "";
      (data.areas || []).forEach(function (area) {
        const zone = document.createElement("section");
        zone.className = "zone";
        const h = document.createElement("h2");
        h.textContent = area.name || "Tavolinat";
        zone.appendChild(h);
        const grid = document.createElement("div");
        grid.className = "grid";
        (area.tables || []).forEach(function (t) {
          current.push(t);
          const b = document.createElement("button");
          b.type = "button";
          b.className = "table-card " + (t.status !== "occupied" ? "free" : "occupied");
          const title = document.createElement("b");
          title.textContent = "Tavolina " + t.number;
          const ico = document.createElement("span");
          ico.className = "ico";
          ico.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3.2 3.8-4.8 7-4.8S17.6 15.8 19 19"/></svg>';
          const line = document.createElement("span");
          if (t.status !== "occupied") line.textContent = "Lirë";
          else line.textContent = (t.item_count || t.order_count || 1) + " artikuj · " + euro(t.total);
          const who = document.createElement("span");
          if (t.status === "occupied" && t.waiter_name) who.textContent = t.waiter_name;
          b.appendChild(title);
          b.appendChild(ico);
          if (who.textContent) b.appendChild(who);
          b.appendChild(line);
          b.addEventListener("click", function () { openTable(t); });
          grid.appendChild(b);
        });
        zone.appendChild(grid);
        floor.appendChild(zone);
      });
      if (!floor.children.length) floor.innerHTML = "<p class='sub'>Nuk ka tavolina.</p>";
    }
    function openTable(t) {
      if (!navigator.onLine || !t.view_only) return openSell(t);
      document.getElementById("sheet-title").textContent = "Tavolina " + t.number;
      let note = "E lirë";
      if (t.view_only) note = "E hapur në arkën e kompjuterit ose në një pajisje tjetër. Mund ta shihni, jo ta ndryshoni.";
      else if (t.editable) note = "E hapur nga kjo arkë. Mund të punohet këtu.";
      document.getElementById("sheet-note").textContent = note;
      const ul = document.getElementById("sheet-items");
      ul.innerHTML = "";
      (t.items || []).forEach(function (it) {
        const li = document.createElement("li");
        li.textContent = it.quantity + " × " + it.name + " — " + euro(it.price);
        ul.appendChild(li);
      });
      document.getElementById("sheet").classList.remove("hidden");
    }
    document.getElementById("sheet-close").addEventListener("click", function () {
      document.getElementById("sheet").classList.add("hidden");
    });
    document.getElementById("back").addEventListener("click", function () {
      sell.classList.add("hidden");
      cart = [];
      sellTable = null;
      loadTables();
    });
    let findTimer = null;
    document.getElementById("find").addEventListener("input", function () {
      const q = document.getElementById("find").value.trim();
      clearTimeout(findTimer);
      if (!q) return;
      findTimer = setTimeout(async function () {
        const res = await api("/products/search/" + encodeURIComponent(q));
        const data = await res.json().catch(function () { return {}; });
        if (res.ok) paintProducts(data.products || []);
      }, 250);
    });
    async function pay(type) {
      if (paying || !sellTable) return;
      if (!cart.length) {
        document.getElementById("pay-msg").textContent = "Shporta është bosh.";
        return;
      }
      paying = true;
      document.getElementById("pay-msg").textContent = "";
      const res = await api("/sale", {
        method: "POST",
        body: JSON.stringify({
          table_id: sellTable.number,
          payment_type: type,
          items: cart.map(function (it) { return { product_id: it.id, quantity: it.quantity, price: it.price }; })
        })
      });
      const data = await res.json().catch(function () { return {}; });
      paying = false;
      if (!res.ok) {
        document.getElementById("pay-msg").textContent = data.gabim || "Shitja nuk u ruajt.";
        return;
      }
      lastSaleId = data.sale_id || "";
      lastPayType = type;
      cart = [];
      paintCart();
      document.getElementById("pay-msg").textContent = "Shitja u ruajt. Duke fiskalizuar...";
      document.getElementById("fiscal-retry").classList.add("hidden");
      fiscalize(true);
    }
    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
    async function sendPrint(fiscal) {
      const note = document.getElementById("pay-msg").textContent;
      document.getElementById("pay-msg").textContent = note + " Duke printuar...";
      const res = await api("/print", {
        method: "POST",
        body: JSON.stringify({
          sale_id: lastSaleId,
          fiscal_number: fiscal && fiscal.fiscal_number ? fiscal.fiscal_number : "",
          nuikf: fiscal && fiscal.nuikf ? fiscal.nuikf : "",
          payment_type: lastPayType,
          staff_name: staffName,
          table_name: sellTable ? sellTable.number : ""
        })
      });
      const data = await res.json().catch(function () { return {}; });
      if (data.offline) {
        document.getElementById("pay-msg").textContent = note + " Printimi do dërgohet kur kthehet interneti.";
        return;
      }
      if (!res.ok || !data.id) {
        document.getElementById("pay-msg").textContent = note + " " + (data.gabim || "Printeri nuk u gjet");
        return;
      }
      for (let i = 0; i < 4; i += 1) {
        await wait(2000);
        const st = await api("/print/job/" + encodeURIComponent(data.id));
        const job = await st.json().catch(function () { return {}; });
        if (job.status === "printed") {
          document.getElementById("pay-msg").textContent = note + " U printua";
          return;
        }
        if (job.status === "failed") {
          document.getElementById("pay-msg").textContent = note + " Printeri nuk u gjet";
          return;
        }
      }
      document.getElementById("pay-msg").textContent = note + " Printeri nuk u gjet";
    }
    async function fiscalize(andPrint) {
      if (!lastSaleId) return;
      const res = await api("/fiscal", { method: "POST", body: JSON.stringify({ sale_id: lastSaleId, payment_type: lastPayType }) });
      const data = await res.json().catch(function () { return {}; });
      const msg = document.getElementById("pay-msg");
      const retry = document.getElementById("fiscal-retry");
      if (data.code === "NO_KEY") {
        msg.textContent = "Çelësi fiskal nuk është konfiguruar — kontakto administratorin";
        retry.classList.add("hidden");
        if (andPrint) sendPrint(data);
        return;
      }
      if (data.queued) {
        msg.textContent = "Shitja u ruajt. ATK nuk u arrit. Do provohet vetë.";
        retry.classList.remove("hidden");
        if (andPrint) sendPrint(data);
        return;
      }
      if (!res.ok || data.ok === false) {
        msg.textContent = data.gabim || "Fiskalizimi dështoi. Shitja mbetet e ruajtur.";
        retry.classList.remove("hidden");
        if (andPrint) sendPrint(data);
        return;
      }
      msg.textContent = "Kuponi u dërgua. Numri " + (data.fiscal_number || "") + (data.nuikf ? " · " + data.nuikf : "");
      retry.classList.add("hidden");
      if (andPrint) sendPrint(data);
    }
    document.getElementById("fiscal-retry").addEventListener("click", function () { fiscalize(false); });
    document.getElementById("pay-grid").addEventListener("click", function (ev) {
      const btn = ev.target.closest("button");
      if (!btn || !document.getElementById("pay-grid").contains(btn)) return;
      if (btn.getAttribute("data-act") === "cancel") {
        cart = [];
        paintCart();
        return;
      }
      if (btn.getAttribute("data-act") === "coupon") {
        document.querySelectorAll("#pay-grid [data-act='coupon']").forEach(function (el) { el.classList.remove("on"); });
        btn.classList.add("on");
        return;
      }
      const type = btn.getAttribute("data-pay");
      if (type) pay(type);
    });
    async function loadTables() {
      const res = await api("/tables");
      const data = await res.json().catch(function () { return {}; });
      if (res.status === 401 && data.code === "PIN_REQUIRED") return showPin();
      if (!res.ok) return showGate(data.gabim || "Tavolinat nuk u ngarkuan.", false);
      paint(data);
    }
    async function boot() {
      if (!slug || !key) return showGate("Hapni linkun e plotë të arkës, me kodin e lokalit.", false);
      const res = await api("/session");
      const data = await res.json().catch(function () { return {}; });
      if (res.status === 401) return showGate("Hyni fillimisht me email, fjalëkalim dhe kodin 6-shifror.", true);
      if (!res.ok) return showGate(data.gabim || "Hyrja dështoi.", false);
      biz.textContent = data.business || "";
      if (data.staff && window.ArkaOffline) ArkaOffline.saveSession(slug, { staff: data.staff, business: data.business || "" });
      if (!data.staff) return showPin();
      loadTables();
    }
    async function syncPost(path, body) {
      const res = await fetch(apiUrl(path), {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json", "X-Arka-Sync": "1", ...(key ? { "x-kitchen-key": key } : {}) },
        body: JSON.stringify(body)
      });
      return res;
    }
    function isServerId(id) {
      const s = String(id || "");
      return s.length > 10 && s.indexOf("local-") !== 0;
    }
    async function syncNow() {
      if (syncing || !navigator.onLine || !window.ArkaOffline) return;
      const sales = await ArkaOffline.pending("pending_sales", slug);
      const fiscals = await ArkaOffline.pending("pending_fiscal", slug);
      const prints = await ArkaOffline.pending("pending_prints", slug);
      if (!sales.length && !fiscals.length && !prints.length) {
        paintNet("");
        return;
      }
      syncing = true;
      paintNet("Duke sinkronizuar...");
      let sent = 0;
      let blocked = false;
      try {
        for (const row of sales) {
          let res;
          try { res = await syncPost("/sale", row.body || {}); }
          catch (e) { blocked = true; break; }
          if (!res.ok) { blocked = true; break; }
          const data = await res.json().catch(function () { return {}; });
          if (!data.sale_id) { blocked = true; break; }
          await ArkaOffline.retarget(slug, row.local_id, data.sale_id);
          await ArkaOffline.remove("pending_sales", row.local_id);
          sent += 1;
        }
        const fiscalRows = await ArkaOffline.pending("pending_fiscal", slug);
        for (const row of fiscalRows) {
          if (blocked) break;
          if (!isServerId(row.sale_id)) continue;
          let res;
          try { res = await syncPost("/fiscal", Object.assign({}, row.body || {}, { sale_id: row.sale_id })); }
          catch (e) { blocked = true; break; }
          if (res.status >= 500) { blocked = true; break; }
          if (!res.ok && res.status !== 200) continue;
          const data = await res.json().catch(function () { return {}; });
          if (data.code === "NO_KEY" || (res.status >= 400 && res.status < 500 && !data.queued && data.ok === false)) continue;
          await ArkaOffline.attachFiscal(slug, row.local_sale_id, data);
          await ArkaOffline.remove("pending_fiscal", row.local_id);
        }
        const printRows = await ArkaOffline.pending("pending_prints", slug);
        for (const row of printRows) {
          if (blocked) break;
          if (!isServerId(row.sale_id)) continue;
          const stillFiscal = (await ArkaOffline.pending("pending_fiscal", slug)).some(function (f) {
            return f.local_sale_id === row.local_sale_id;
          });
          if (stillFiscal) continue;
          let res;
          try { res = await syncPost("/print", Object.assign({}, row.body || {}, { sale_id: row.sale_id })); }
          catch (e) { blocked = true; break; }
          if (!res.ok) { blocked = true; break; }
          await ArkaOffline.remove("pending_prints", row.local_id);
        }
        if (!blocked) {
          const tables = await api("/tables");
          if (tables.ok) {
            const data = await tables.json().catch(function () { return null; });
            if (data && !floor.classList.contains("hidden")) paint(data);
          }
          const cats = await api("/categories");
          const catData = await cats.json().catch(function () { return {}; });
          (catData.categories || []).forEach(function (c) { api("/products/" + encodeURIComponent(c.id)); });
        }
      } finally {
        syncing = false;
        if (!navigator.onLine) paintNet("Pa internet — shitjet ruhen lokalisht. Bllokimi i tavolinave nuk punon pa internet.");
        else if (sent > 0) paintNet("U sinkronizua — " + sent + " shitje u dërguan");
        else paintNet("");
      }
    }
    document.getElementById("pin-go").addEventListener("click", async function () {
      document.getElementById("pin-msg").textContent = "";
      const res = await api("/pin", { method: "POST", body: JSON.stringify({ pin: document.getElementById("pin").value }) });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        document.getElementById("pin-msg").textContent = data.gabim || "PIN i gabuar.";
        return;
      }
      loadTables();
    });
    outBtn.addEventListener("click", async function () {
      await api("/logout-pin", { method: "POST", body: "{}" });
      showPin();
    });
    document.getElementById("pwa-manifest").href = location.pathname + "/manifest.json" + location.search;
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/arka-sw.js", { scope: location.pathname }).catch(function () {});
    }
    window.addEventListener("online", function () { syncNow(); });
    window.addEventListener("offline", function () {
      paintNet("Pa internet — shitjet ruhen lokalisht. Bllokimi i tavolinave nuk punon pa internet.");
    });
    if (!navigator.onLine) paintNet("Pa internet — shitjet ruhen lokalisht. Bllokimi i tavolinave nuk punon pa internet.");
    boot();
    setInterval(function () { if (!floor.classList.contains("hidden") && navigator.onLine && !syncing) loadTables(); }, 5000);
    setInterval(function () { if (navigator.onLine) syncNow(); }, 20000);
  </script>
</body>
</html>
